
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ТУСОВКА ❤️</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 15px;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffd6e7, #e6ccff);
  color: #4a245e;
  text-align: center;
}

.container {
  max-width: 500px;
  margin: 0 auto;
}

h1 {
  color: #b83280;
  font-size: 32px;
}

.card {
  background: rgba(255,255,255,0.94);
  border-radius: 22px;
  padding: 16px;
  margin-top: 18px;
  box-shadow: 0 5px 20px rgba(100,30,100,0.15);
}

button {
  display: block;
  width: 100%;
  padding: 13px;
  margin: 10px 0;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #ff79b0, #bd82ff);
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

button:active { transform: scale(0.98); }

p { line-height: 1.5; }

.coins {
  color: #b83280;
  font-weight: bold;
}

.room-image {
  display: block;
  width: 100%;
  height: auto;
  max-height: 650px;
  object-fit: contain;
  border-radius: 16px;
  margin: 12px auto;
}

.room-scene {
  position: relative;
  width: 100%;
  margin: 12px auto;
  overflow: hidden;
  border-radius: 16px;
}

.room-info {
  background: #fff0f7;
  border-radius: 14px;
  padding: 12px;
  margin: 12px 0;
}

.room-menu {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  margin: 14px 0;
}

.menu-item {
  min-height: 66px;
  margin: 0;
  padding: 7px 3px;
  border-radius: 12px;
  background: #fff0f7;
  color: #873b78;
  font-size: 12px;
  border: 1px solid #f4c2df;
}

.menu-item span {
  display: block;
  font-size: 22px;
  margin-bottom: 3px;
}

.top-button {
  background: linear-gradient(135deg, #ffb52e, #ff6e9d);
}

.top-entry {
  background: #fff0f7;
  border: 1px solid #f4c2df;
  border-radius: 15px;
  padding: 12px;
  margin: 12px 0;
  overflow-wrap: anywhere;
}

.top-avatar { font-size: 30px; }

.top-name {
  color: #b83280;
  font-weight: bold;
}

.top-text {
  font-weight: bold;
  margin: 8px 0;
}

.chat-box {
  background: #fff0f7;
  border-radius: 14px;
  padding: 10px;
  margin-top: 14px;
  text-align: left;
}

.chat-messages {
  max-height: 180px;
  overflow-y: auto;
  margin-bottom: 10px;
}

.chat-message {
  background: white;
  border-radius: 10px;
  padding: 8px;
  margin: 6px 0;
  overflow-wrap: anywhere;
}

.chat-form {
  display: flex;
  gap: 6px;
}

.chat-form input {
  min-width: 0;
  flex: 1;
  border: 1px solid #e5b8d7;
  border-radius: 10px;
  padding: 10px;
  font-size: 14px;
}

.chat-form button {
  width: 54px;
  margin: 0;
  padding: 8px;
}

.player-seat {
  position: absolute;
  width: 66px;
  min-height: 45px;
  padding: 5px 2px;
  margin: 0;
  border: 2px solid white;
  border-radius: 12px;
  color: white;
  font-size: 10px;
  z-index: 3;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

.player-seat span {
  display: block;
  font-size: 18px;
}

.pink-seat { background: #ed65a5; }
.blue-seat { background: #4389e9; }

.seat-left { left: 4px; }
.seat-right { right: 4px; }

.seat-1 { top: 5%; }
.seat-2 { top: 24%; }
.seat-3 { top: 43%; }
.seat-4 { top: 62%; }
.seat-5 { top: 81%; }

.small-note {
  font-size: 12px;
  color: #866b91;
}

.back-button {
  background: #b58ad7;
}
</style>
</head>

<body>
<div class="container">
  <h1>ТУСОВКА ❤️</h1>
  <p>Твоя компания, твои друзья, твои приключения!</p>
  <div class="card" id="card"></div>
</div>

<script>
const card = document.getElementById("card");

let currentRoomKey = "";
let currentRoomTitle = "";
let occupiedSeats = {};

let demoCoins = Number(localStorage.getItem("tusovkaDemoCoins"));
if (!Number.isFinite(demoCoins) || demoCoins < 0) {
  demoCoins = 100;
}

function saveCoins() {
  localStorage.setItem("tusovkaDemoCoins", String(demoCoins));
}

let topEntries = [];
try {
  topEntries = JSON.parse(
    localStorage.getItem("tusovkaTopEntries") || "[]"
  );
  if (!Array.isArray(topEntries)) topEntries = [];
} catch (e) {
  topEntries = [];
}

function saveTop() {
  localStorage.setItem("tusovkaTopEntries", JSON.stringify(topEntries));
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, function(char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char];
  });
}

/* ГЛАВНАЯ */

function home() {
  card.innerHTML = `
    <h2>🎉 Добро пожаловать!</h2>
    <p>Знакомься, общайся, играй и находи свою компанию.</p>
    <p class="coins">🪙 Твои Тусы: ${demoCoins}</p>
    <button onclick="startGame()">🎮 Начать игру</button>
    <button onclick="rooms()">🏠 Комнаты</button>
    <button class="top-button" onclick="topGame()">🏆 ТОП ИГРЫ</button>
  `;
}

function startGame() {
  card.innerHTML = `
    <h2>🎉 Твоя ТУСОВКА начинается!</h2>
    <p>💖 Здесь ты сможешь знакомиться и находить друзей.</p>
    <p>🎁 Впереди подарки, задания и игровые события!</p>
    <button onclick="rooms()">🏠 Выбрать комнату</button>
    <button class="top-button" onclick="topGame()">🏆 ТОП ИГРЫ</button>
    <button class="back-button" onclick="home()">⬅️ На главную</button>
  `;
}

/* СПИСОК КОМНАТ */

function rooms() {
  card.innerHTML = `
    <h2>🏠 Комнаты ТУСОВКИ</h2>
    <p>Выбери, куда отправимся!</p>

    <button onclick="newcomer()">💖 Знакомство с игрой</button>
    <button onclick="seasons()">🌸 Времена года</button>
    <button onclick="footballRoom()">⚽ Футбольная комната</button>
    <button onclick="openRoom('cafe','☕ Кафе','Уютное кафе для общения!')">☕ Кафе</button>
    <button onclick="openRoom('bath','🛁 Баня','Комната отдыха и общения!')">🛁 Баня</button>
    <button onclick="openRoom('yacht','🛥️ Яхта','Добро пожаловать на борт!')">🛥️ Яхта</button>
    <button onclick="openRoom('space','🚀 Космос','Путешествие среди звёзд!')">🚀 Космос</button>
    <button onclick="openRoom('palace','👑 Дворец','Добро пожаловать во дворец!')">👑 Дворец</button>

    <button class="top-button" onclick="topGame()">🏆 ТОП ИГРЫ</button>
    <button class="back-button" onclick="home()">⬅️ На главную</button>
  `;
}

/* СЕЗОНЫ */

function seasons() {
  card.innerHTML = `
    <h2>🌸 Времена года</h2>
    <p>Выбери свою сезонную комнату!</p>
    <button onclick="winterRoom()">❄️ Зимняя комната</button>
    <button onclick="openRoom('spring','🌸 Весна','Весенняя ТУСОВКА!')">🌸 Весенняя комната</button>
    <button onclick="openRoom('summer','☀️ Лето','Летняя ТУСОВКА!')">☀️ Летняя комната</button>
    <button onclick="autumnRoom()">🍂 Осенняя комната</button>
    <button onclick="rooms()">🏠 Другие комнаты</button>
  `;
}

/* ОБЩЕЕ МЕНЮ ДЛЯ КОМНАТ */

function roomMenuHTML() {
  const items = [
    ["💌", "Личные сообщения", "private"],
    ["👥", "Общий чат", "chat"],
    ["🎼", "Музыка", "music"],
    ["📒", "Задания", "tasks"],
    ["👣", "Гости", "guests"],
    ["👫", "Друзья", "friends"],
    ["🖼️", "Фон", "background"],
    ["🌈", "Рамки", "frames"],
    ["🎭", "Эмоции", "emotions"],
    ["🎁", "Подарки", "gifts"],
    ["🏆", "Рейтинг", "rating"],
    ["🔄", "Комнаты", "rooms"],
    ["👤", "Профиль", "profile"],
    ["🚪", "Выход", "exit"]
  ];

  return `
    <div class="room-menu">
      ${items.map(item => `
        <button class="menu-item" onclick="roomAction('${item[2]}')">
          <span>${item[0]}</span>${item[1]}
        </button>
      `).join("")}
    </div>
  `;
}

/* ДЕЙСТВИЯ МЕНЮ */

function roomAction(action) {
  const messages = {
    private: "💌 Личные сообщения — этот раздел пока демонстрационный.",
    music: "🎼 Музыкальный раздел пока демонстрационный.",
    tasks: "📒 Раздел заданий пока демонстрационный.",
    guests: "👣 Список гостей пока демонстрационный.",
    friends: "👫 Лента друзей пока демонстрационная.",
    background: "🖼️ Смена оформления комнаты пока демонстрационная.",
    frames: "🌈 Коллекция рамок пока демонстрационная.",
    emotions: "🎭 Эмоции аватара пока демонстрационные.",
    gifts: "🎁 Каталог подарков пока демонстрационный.",
    rating: "🏆 Рейтинг пока демонстрационный.",
    profile: "👤 Профиль пока демонстрационный."
  };

  if (action === "rooms") {
    rooms();
    return;
  }

  if (action === "exit") {
    home();
    return;
  }

  if (action === "chat") {
    document.getElementById("room-chat").scrollIntoView({
      behavior: "smooth",
      block: "center"
    });
    return;
  }

  alert(messages[action] || "Раздел пока демонстрационный.");
}

/* ОБЩИЙ ЧАТ ДЛЯ ДЕМО */

function getRoomMessages() {
  try {
    const data = JSON.parse(
      localStorage.getItem("tusovkaChat_" + currentRoomKey) || "[]"
    );
    return Array.isArray(data) ? data : [];
  } catch (e) {
    return [];
  }
}

function renderRoomMessages() {
  const box = document.getElementById("chat-messages");
  if (!box) return;

  const messages = getRoomMessages();

  if (messages.length === 0) {
    box.innerHTML = '<p class="small-note">Пока сообщений нет. Начни общение!</p>';
    return;
  }

  box.innerHTML = messages.map(message => `
    <div class="chat-message">
      <strong>${escapeHTML(message.name)}:</strong>
      ${escapeHTML(message.text)}
    </div>
  `).join("");

  box.scrollTop = box.scrollHeight;
}

function sendRoomMessage() {
  const input = document.getElementById("chat-input");
  if (!input) return;

  const text = input.value.trim();
  if (!text) return;

  const messages = getRoomMessages();
  messages.push({ name: "Игрок", text: text });

  localStorage.setItem(
    "tusovkaChat_" + currentRoomKey,
    JSON.stringify(messages.slice(-50))
  );

  input.value = "";
  renderRoomMessages();
}

/* ЕДИНЫЙ ШАБЛОН КОМНАТ */

function renderRoom(options) {
  currentRoomKey = options.key;
  currentRoomTitle = options.title;

  let scene = "";

  if (options.football) {
    let seatsHTML = "";

    for (let i = 1; i <= 5; i++) {
      seatsHTML += `
        <button class="player-seat pink-seat seat-left seat-${i}"
          data-team="pink" data-number="${i}">
          ${occupiedSeats["pink" + i] || "<span>＋</span>Свободно"}
        </button>
        <button class="player-seat blue-seat seat-right seat-${i}"
          data-team="blue" data-number="${i}">
          ${occupiedSeats["blue" + i] || "<span>＋</span>Свободно"}
        </button>
      `;
    }

    scene = `
      <div class="room-scene">
        <img class="room-image" src="${options.image}" alt="${escapeHTML(options.title)}">
        ${seatsHTML}
      </div>
      <p>👥 Игроков: ${Object.keys(occupiedSeats).length} / 10</p>
    `;
  } else {
    scene = `
      <img class="room-image"
        src="${options.image}"
        alt="${escapeHTML(options.title)}">
    `;
  }

  card.innerHTML = `
    <h2>${options.title}</h2>
    ${scene}
    <p>${options.description}</p>

    <div class="room-info">
      👥 Добро пожаловать в комнату!
    </div>

    ${roomMenuHTML()}

    <button class="top-button" onclick="topGame()">🏆 ТОП ИГРЫ</button>

    <div class="chat-box" id="room-chat">
      <strong>👥 Общий чат комнаты</strong>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-form">
        <input id="chat-input" type="text" maxlength="300"
          placeholder="Напиши сообщение...">
        <button type="button" onclick="sendRoomMessage()">😄</button>
      </div>
      <p class="small-note">
        Демоверсия: сообщения сохраняются только в этом браузере.
      </p>
    </div>

    <button class="back-button" onclick="rooms()">🔄 Сменить комнату</button>
    <button class="back-button" onclick="home()">🚪 Выйти</button>
  `;

  renderRoomMessages();
}

/* ЗИМНЯЯ КОМНАТА */

function winterRoom() {
  renderRoom({
    key: "winter",
    title: "❄️ Зимняя ТУСОВКА ❤️",
    image: "1794294596281.jpg",
    description: "🔥 Уютный камин, снежные пейзажи и зимнее настроение!"
  });
}

/* ОСЕННЯЯ КОМНАТА */

function autumnRoom() {
  renderRoom({
    key: "autumn",
    title: "🍂 Осенняя ТУСОВКА ❤️",
    image: "1794304414406.jpg",
    description: "🍁 Добро пожаловать в уютную осеннюю комнату!"
  });
}

/* ФУТБОЛЬНАЯ КОМНАТА */

function footballRoom() {
  renderRoom({
    key: "football",
    title: "⚽ Футбольная ТУСОВКА ❤️",
    image: "1793609555494.jpg",
    description: "🏆 Выбирай команду и занимай свободное место!",
    football: true
  });
}

/* ЗАНЯТЬ ФУТБОЛЬНОЕ МЕСТО */

card.addEventListener("click", function(event) {
  const seat = event.target.closest(".player-seat");
  if (!seat) return;

  takeSeat(seat.dataset.team, Number(seat.dataset.number));
});

function takeSeat(team, number) {
  const key = team + number;

  if (occupiedSeats[key]) {
    alert("Это место уже занято!");
    return;
  }

  if (Object.keys(occupiedSeats).length >= 10) {
    alert("Все места заняты!");
    return;
  }

  const avatar = prompt("Выбери эмодзи для своего аватара:", "😊");
  if (avatar === null || avatar.trim() === "") return;

  occupiedSeats[key] = `<span>${escapeHTML(avatar.trim())}</span>Ты`;
  footballRoom();
}

/* ОСТАЛЬНЫЕ КОМНАТЫ */

function openRoom(key, title, description) {
  const images = {
    cafe: "",
    bath: "",
    yacht: "",
    space: "",
    palace: "",
    spring: "",
    summer: ""
  };

  if (!images[key]) {
    currentRoomKey = key;
    currentRoomTitle = title;

    card.innerHTML = `
      <h2>${title}</h2>
      <div class="room-info">${description}</div>
      <p class="small-note">
        Изображение этой комнаты подключим, когда будет готово её имя файла.
      </p>
      ${roomMenuHTML()}
      <button class="top-button" onclick="topGame()">🏆 ТОП ИГРЫ</button>
      <div class="chat-box" id="room-chat">
        <strong>👥 Общий чат комнаты</strong>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-form">
          <input id="chat-input" type="text" maxlength="300"
            placeholder="Напиши сообщение...">
          <button type="button" onclick="sendRoomMessage()">😄</button>
        </div>
        <p class="small-note">
          Демоверсия: сообщения сохраняются только в этом браузере.
        </p>
      </div>
      <button class="back-button" onclick="rooms()">🔄 Сменить комнату</button>
      <button class="back-button" onclick="home()">🚪 Выйти</button>
    `;

    renderRoomMessages();
  }
}

/* ТОП ИГРЫ */

function topGame() {
  let entriesHTML = "";

  if (topEntries.length === 0) {
    entriesHTML = "<p>🌟 Пока записей нет. Будь первым!</p>";
  } else {
    topEntries.forEach(function(entry) {
      entriesHTML += `
        <div class="top-entry">
          <div class="top-avatar">${escapeHTML(entry.avatar)}</div>
          <div class="top-name">${escapeHTML(entry.name)}</div>
          <div class="top-text">${escapeHTML(entry.text)}</div>
        </div>
      `;
    });
  }

  card.innerHTML = `
    <h2>🏆 ТОП ИГРЫ</h2>
    <p>🌟 Общая лента игроков ТУСОВКИ</p>
    <p class="coins">🪙 Твои Тусы: ${demoCoins}</p>

    <button class="top-button" onclick="publishTop()">
      ⭐ ХОЧУ В ТОП — 10 Тус
    </button>

    ${entriesHTML}

    <p class="small-note">
      Максимум 6 записей. Не более 10 слов.
    </p>

    <button onclick="rooms()">🏠 Комнаты</button>
    <button onclick="home()">⬅️ На главную</button>
  `;
}

function publishTop() {
  if (demoCoins < 10) {
    alert("Недостаточно Тус для публикации!");
    return;
  }

  const message = prompt("Напиши сообщение для ТОП (не больше 10 слов):");
  if (message === null) return;

  const text = message.trim();
  const words = text.split(/\s+/).filter(Boolean);

  if (!text) {
    alert("Напиши сообщение!");
    return;
  }

  if (words.length > 10) {
    alert("Максимум 10 слов!");
    return;
  }

  demoCoins -= 10;
  saveCoins();

  topEntries.unshift({
    avatar: "😊",
    name: "Игрок",
    text: text
  });

  topEntries = topEntries.slice(0, 6);
  saveTop();

  alert("🌟 Твоя запись появилась в ТОП! Списано 10 Тус.");
  topGame();
}

/* ЗНАКОМСТВО */

function newcomer() {
  card.innerHTML = `
    <h2>💖 Знакомство с игрой</h2>
    <p>🌸 Добро пожаловать в ТУСОВКУ!</p>
    <p>👋 Здесь начинается твоё приключение.</p>
    <p>📋 Первое задание: поздоровайся с игроками.</p>
    <p>🎁 Твой первый подарок — «Привет!»</p>
    <button onclick="rooms()">🏠 Другие комнаты</button>
    <button onclick="home()">⬅️ На главную</button>
  `;
}

/* ЗАПУСК */

home();
</script>
</body>
</html>
