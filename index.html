<!DOCTYPE html><html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ТУСОВКА ❤️</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffd6e7, #e6ccff);
  text-align: center;
  color: #4a245e;
}
.container {
  max-width: 600px;
  margin: auto;
  padding: 40px 20px;
}
h1 {
  font-size: 48px;
  margin: 20px 0 10px;
}
p {
  font-size: 20px;
}
.card {
  background: white;
  border-radius: 25px;
  padding: 25px;
  margin-top: 30px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.12);
}
button {
  border: 0;
  border-radius: 30px;
  padding: 15px 30px;
  margin: 8px;
  font-size: 18px;
  cursor: pointer;
}
.start {
  background: #ff5fa2;
  color: white;
}
.rooms {
  background: #eee;
  color: #4a245e;
}
</style>
</head>
<body>
<div class="container">
<h1>ТУСОВКА ❤️</h1> 
<p>Здесь начинается твоя тусовка!</p>
<div class="card">
<h2>🎉 Добро пожаловать!</h2>
<p>Знакомься, общайся, играй и находи свою компанию.</p>
<button class="start">🎮 Начать игру</button>
<button class="rooms">🏠 Комнаты</button>
</div>
</div>
<script>
const card = document.querySelector('.card');

document.querySelector('.start').onclick = function() {
  card.innerHTML = `
    <h2>🎉 Добро пожаловать в ТУСОВКУ!</h2>
    <p>Твоя тусовка начинается здесь ❤️</p>
    <p>Скоро здесь появится вход в игру!</p>
    <button onclick="location.reload()">🏠 На главную</button>
  `;
};

document.querySelector('.rooms').onclick = function() {
  card.innerHTML = `
    <h2>🏠 Комнаты ТУСОВКИ</h2>
    <button onclick="showNewRoom()">💖 Знакомство с игрой</button>
    <p>⚽ Спортивная комната</p>
    <p>☕ Кафе</p>
    <p>🌸 Времена года</p>
    <button onclick="location.reload()">🏠 На главную</button>
  `;
};
function showNewRoom() {
card.innerHTML = "<h2>💖 Знакомство с игрой</h2> <p>🌸 Добро пожаловать в ТУСОВКУ!</p> <p>👋 Здесь начинается твоё приключение!</p> <p>📋 Первое задание: поздоровайся с игроками.</p> <p>🎁 Твой первый подарок — «Привет!»</p> <button onclick="location.reload()">🏠 На главную</button>";
}
</script>
</html>
